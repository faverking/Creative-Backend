name: Deploy MonoNest Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build

      - name: Check production dependencies
        run: pnpm deps:prod:check

      - name: Prepare deploy package
        run: |
          rm -rf .deploy-package
          mkdir -p .deploy-package
          cp -r dist .deploy-package/dist
          cp package.json .deploy-package/package.json
          cp pnpm-lock.yaml .deploy-package/pnpm-lock.yaml
          cp ecosystem.config.cjs .deploy-package/ecosystem.config.cjs
          tar -czf backend.tar.gz -C .deploy-package .

      - name: Upload package to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: backend.tar.gz
          target: /www/apps/backend/shared

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_NAME="mononest-api"
            LEGACY_APP_NAME="mononest"
            RELEASE_ID="${{ github.sha }}"
            APP_ROOT="/www/apps/backend"
            RELEASE_DIR="$APP_ROOT/releases/$RELEASE_ID"
            CURRENT_DIR="$APP_ROOT/current"
            SHARED_DIR="$APP_ROOT/shared"
            ENV_FILE="/www/env/backend/.env"
            HEALTH_RESPONSE_FILE="/tmp/mononest-health-response.json"

            mkdir -p "$RELEASE_DIR" "$SHARED_DIR"
            tar -xzf "$SHARED_DIR/backend.tar.gz" -C "$RELEASE_DIR"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing production env file: $ENV_FILE"
              echo "Create it on the server from deploy/env.production.example before rerunning this workflow."
              exit 1
            fi

            corepack enable
            corepack prepare pnpm@10.11.0 --activate

            cd "$RELEASE_DIR"

            pnpm install --prod --frozen-lockfile

            cp "$ENV_FILE" "$RELEASE_DIR/.env"
            ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"

            cd "$CURRENT_DIR"
            if pm2 describe "$LEGACY_APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$LEGACY_APP_NAME"
            fi
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$APP_NAME"
            fi
            pm2 start ecosystem.config.cjs --env production --update-env

            if ! pm2 describe pm2-logrotate >/dev/null 2>&1; then
              pm2 install pm2-logrotate
            fi
            pm2 set pm2-logrotate:max_size 20M
            pm2 set pm2-logrotate:retain 14
            pm2 set pm2-logrotate:compress true

            pm2 save

            APP_PORT="$(grep -E '^PORT=' "$RELEASE_DIR/.env" | tail -n 1 | cut -d= -f2-)"
            APP_PREFIX="$(grep -E '^API_PREFIX=' "$RELEASE_DIR/.env" | tail -n 1 | cut -d= -f2-)"
            APP_PORT="${APP_PORT:-3000}"
            APP_PREFIX="${APP_PREFIX:-api/v1}"
            APP_PREFIX="${APP_PREFIX#/}"
            APP_PREFIX="${APP_PREFIX%/}"
            HEALTH_URL="http://127.0.0.1:$APP_PORT/$APP_PREFIX/health"

            for ATTEMPT in $(seq 1 15); do
              if curl -fsS "$HEALTH_URL" -o "$HEALTH_RESPONSE_FILE"; then
                echo "Health check passed: $HEALTH_URL"
                cat "$HEALTH_RESPONSE_FILE"
                break
              fi

              if [ "$ATTEMPT" -eq 15 ]; then
                echo "Health check failed after $ATTEMPT attempts: $HEALTH_URL"
                pm2 logs "$APP_NAME" --lines 80 --nostream || true
                exit 1
              fi

              sleep 2
            done

            CURRENT_RELEASE="$(readlink -f "$CURRENT_DIR")"
            find "$APP_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | while IFS= read -r OLD_RELEASE; do
                  if [ "$(readlink -f "$OLD_RELEASE")" != "$CURRENT_RELEASE" ]; then
                    rm -rf "$OLD_RELEASE"
                  fi
                done

            echo "Backend deployed: $APP_NAME $RELEASE_ID"
