name: Rollback MonoNest Backend

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release id to roll back to, usually a git SHA under /www/apps/backend/releases'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Roll back on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_NAME="mononest-api"
            LEGACY_APP_NAME="mononest"
            RELEASE_ID="${{ inputs.release_id }}"
            APP_ROOT="/www/apps/backend"
            RELEASE_DIR="$APP_ROOT/releases/$RELEASE_ID"
            CURRENT_DIR="$APP_ROOT/current"
            NEXT_CURRENT_DIR="$APP_ROOT/current.next"
            ENV_FILE="/www/env/backend/.env"

            if ! printf '%s' "$RELEASE_ID" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "Invalid release id: $RELEASE_ID"
              exit 1
            fi

            if [ ! -d "$RELEASE_DIR" ]; then
              echo "Release not found: $RELEASE_DIR"
              echo "Available releases:"
              find "$APP_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -r | head -n 20
              exit 1
            fi

            if [ ! -f "$RELEASE_DIR/ecosystem.config.cjs" ]; then
              echo "Invalid release: missing ecosystem.config.cjs"
              exit 1
            fi

            if [ ! -f "$RELEASE_DIR/dist/src/main.js" ]; then
              echo "Invalid release: missing dist/src/main.js"
              exit 1
            fi

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing production env file: $ENV_FILE"
              exit 1
            fi

            cp "$ENV_FILE" "$RELEASE_DIR/.env"

            ln -sfn "$RELEASE_DIR" "$NEXT_CURRENT_DIR"
            mv -Tf "$NEXT_CURRENT_DIR" "$CURRENT_DIR"

            cd "$CURRENT_DIR"
            if pm2 describe "$LEGACY_APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$LEGACY_APP_NAME"
            fi
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 delete "$APP_NAME"
            fi
            pm2 start ecosystem.config.cjs --env production --update-env
            pm2 save

            echo "Backend rolled back: $APP_NAME $RELEASE_ID"
